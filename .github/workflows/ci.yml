name: CI

# Neden: Vercel main'i otomatik deploy ediyor. `next build` zaten tip hatasında patlar ama i18n
# taraması (çevrilmemiş Türkçe + TR/EN anahtar paritesi) HİÇ otomatik koşmuyordu — bu yüzden
# EN arayüzde ham anahtar basan bir hata canlıya çıkabilmişti. Artık her push'ta koşuyor.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tip kontrolü + i18n + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: bağımlılıklar
        run: npm ci

      - name: TypeScript tip kontrolü
        run: npx tsc --noEmit

      - name: i18n taraması (çevrilmemiş metin + anahtar paritesi)
        run: npm run i18n:check

      - name: Hukuk metinleri güncel mi (yerelde zorlar, CI'da atlar)
        run: npm run hukuk:check

      # API SÖZLEŞMESİ DAMGASI: src/types/api.ts üç repoda da BİREBİR aynı olmalı. Damga
      # içeriğin hash'i olduğu için, damgaları eşit olan iki dosya kanıtlanabilir şekilde aynıdır.
      # Bir repoda değişip diğerlerinde değişmezse uyuşmazlık yine derleyiciden kaçardı.
      - name: API sözleşmesi damgası (backend ↔ web ↔ mobil)
        run: npm run types:check

      # Lint ARTIK CI'DA (task #75). Uzun süre eklenemiyordu çünkü 232 hata vardı.
      # Gerçek kusurlar düzeltildi; bilinen borç (any tipleri + React Compiler hazırlık
      # kuralları) eslint.config.mjs'te bilinçli olarak UYARI seviyesinde — gerekçeleri
      # orada yazılı. Bu adım HATALARDA kırılır, uyarılar kırmızı yapmaz.
      - name: lint (hatalarda kırılır, bilinen borç uyarı)
        run: npx eslint .

      # E2E (task #69). Backend'de 167 test vardı, ARAYÜZDE SIFIR — denetimdeki web
      # hatalarının hepsi (kalan-yer, saat dilimi, rozet, hata gösterimi) tam bu boşluktaydı.
      # API mock'lanır: gerçek backend/DB gerekmez, testler deterministiktir ve doğru katmanı
      # (istemcinin sunucudan geleni yorumlaması) sınar.
      # BİRİM TESTLERİ (Vitest) — web'de HİÇ birim testi koşucusu yoktu, yalnız Playwright vardı.
      # Realm-duyarlı jeton yenileme saf TypeScript ve İKİ KEZ gerçekten bozuldu; mobil ikizinde
      # regresyon testi varken web'de yoktu. e2e ile çakışmaz (vitest e2e/ klasörünü hariç tutar).
      - name: birim testleri (vitest)
        run: npm test

      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium

      - name: e2e (arayüz regresyon)
        run: npx playwright test

      - name: e2e raporu (kırılırsa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: production build
        # NEXT_PUBLIC_API_URL kodda fallback'li; build için gerçek backend gerekmiyor.
        run: npm run build
